<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5ef" />
    <title>Luiza e Victor — Convite de casamento</title>
    <link rel="preload" href="assets/envelope.png" as="image" />
    <link rel="preload" href="assets/convite.png" as="image" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="experience" id="experience">
      <section class="welcome" aria-labelledby="welcome-title">
        <p class="eyebrow">Luiza &amp; Victor</p>
        <h1 id="welcome-title">Um convite especial</h1>
        <button
          class="envelope-button"
          id="open-invitation"
          type="button"
          aria-describedby="open-hint"
        >
          <img
            src="assets/envelope.png"
            alt="Envelope do convite de casamento de Luiza e Victor"
            draggable="false"
          />
          <span class="seal" aria-hidden="true"></span>
        </button>
        <p class="open-hint" id="open-hint">Toque no envelope para abrir</p>
      </section>

      <section
        class="invitation-view"
        id="invitation-view"
        aria-hidden="true"
        aria-label="Convite de casamento"
      >
        <div class="invitation-content">
          <div class="invitation-paper">
            <img
              src="assets/convite.png"
              alt="Convite de casamento de Luiza e Victor, para 21 de novembro de 2026"
              draggable="false"
            />
          </div>
          <button class="replay-button" id="replay-animation" type="button">
            <span aria-hidden="true">↺</span> Ver novamente
          </button>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
